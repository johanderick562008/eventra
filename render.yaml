# Render Blueprint. If the backend lives in a `backend/` folder of a larger repo, move this file
# to the repo root (Render reads render.yaml from the root) and keep `rootDir: backend`.
services:
  - type: web
    name: eventra-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eventra-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false # set to your deployed frontend origin, e.g. https://eventra.vercel.app
      - key: FORWARDED_ALLOW_IPS
        value: "*" # Render's proxy terminates TLS in front of the container
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: eventra-db
    plan: free
    databaseName: eventra
    user: eventra
